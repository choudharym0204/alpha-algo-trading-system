[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-algo-trading-system"
version = "0.1.0"
description = "Alpha Algo Trading System monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0.52",
  "Alembic>=1.19.1",
  "FastAPI>=0.141.1",
  "psycopg[binary]>=3.2",
  "uvicorn>=0.30",
  "pydantic-settings>=2.0",
  "argon2-cffi>=23",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
