name: CI

# --------------------------------------------------------------------------- #
# Alpha Algo Trading System — CI/CD quality gates (Phase 22).
#
# Every gate must pass before a change can merge. CI NEVER enables LIVE,
# connects to a real broker, deploys credentials, or bypasses safety gates.
# Secrets come only from GitHub secret storage (never committed). Tests use
# fake/test credentials only.
# --------------------------------------------------------------------------- #

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------- #
  # 1. Python lint + syntax
  # ------------------------------------------------------------------------- #
  lint:
    name: Lint & syntax (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile all Python (syntax check)
        run: python -m compileall -q apps packages services backtesting migrations scripts tests

      - name: Ruff (pyflakes + syntax errors)
        run: ruff check .

  # ------------------------------------------------------------------------- #
  # 2. Backend tests (unit + in-memory integration/e2e; no DB required)
  # ------------------------------------------------------------------------- #
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run full backend regression
        run: python -m pytest tests/ -q

  # ------------------------------------------------------------------------- #
  # 3. Security — secret scanning (real-secret patterns + broker placeholders)
  # ------------------------------------------------------------------------- #
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for secrets, broker placeholders, LIVE flags
        run: python scripts/security_scan.py

  # ------------------------------------------------------------------------- #
  # 4. Migration chain validation (offline — no database required)
  # ------------------------------------------------------------------------- #
  migration-check:
    name: Migration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate migration graph (offline)
        run: python scripts/check_migrations.py

  # ------------------------------------------------------------------------- #
  # 5. Web — typecheck + unit tests + production build
  # ------------------------------------------------------------------------- #
  web-build:
    name: Web typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # ------------------------------------------------------------------------- #
  # 6. Mobile — analyze + unit/widget tests + Android build
  # ------------------------------------------------------------------------- #
  mobile-build:
    name: Mobile analyze + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Analyze
        run: flutter analyze
        working-directory: apps/mobile

      - name: Unit & widget tests
        run: flutter test
        working-directory: apps/mobile

      - name: Build Android APK (debug)
        run: flutter build apk --debug
        working-directory: apps/mobile

  # ------------------------------------------------------------------------- #
  # 7. Desktop (Windows) — analyze + tests + Windows build
  #    NOTE: requires VS 2022 C++ toolchain incl. ATL (flutter_secure_storage).
  # ------------------------------------------------------------------------- #
  desktop-build:
    name: Desktop (Windows) analyze + test + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: apps/desktop

      - name: Analyze
        run: flutter analyze
        working-directory: apps/desktop

      - name: Unit & widget tests
        run: flutter test
        working-directory: apps/desktop

      - name: Build Windows desktop
        run: flutter build windows
        working-directory: apps/desktop
