name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          set -euo pipefail
          git --version
          docker compose version

      - name: Check diff hygiene
        run: |
          set -euo pipefail
          git diff --check

      - name: Scan for secret patterns
        run: |
          set -euo pipefail
          if rg -n --hidden \
            --glob '!.git/**' \
            --glob '!node_modules/**' \
            --glob '!.venv/**' \
            --glob '!.github/workflows/**' \
            '(gh[pou]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{16,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo "Secret-like patterns found in repository contents."
            exit 1
          fi

      - name: Validate Docker Compose files
        run: |
          set -euo pipefail
          docker compose config
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config
          docker compose -f docker-compose.test.yml config
