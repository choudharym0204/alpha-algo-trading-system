name: ${COMPOSE_PROJECT_NAME:-alpha-algo-trading-system}-test

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ${COMPOSE_PROJECT_NAME:-alpha-algo-trading-system}-test-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-alpha_algo_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-alpha_algo_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-replace-with-local-test-password}
    ports:
      - "${POSTGRES_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - alpha-algo-test

  redis:
    image: redis:7.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-alpha-algo-trading-system}-test-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_TEST_PORT:-56379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - alpha-algo-test

networks:
  alpha-algo-test:
    driver: bridge

